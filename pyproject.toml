[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whorl-midi"
version = "0.1.0"
description = "Hall-sensor spinner to MIDI control bridge"
requires-python = ">=3.10"

[project.optional-dependencies]
midi = ["pyserial", "mido", "python-rtmidi"]

[project.scripts]
whorl-bridge = "spinner_midi_bridge:main"

[tool.setuptools]
py-modules = ["spinner_midi_bridge"]
